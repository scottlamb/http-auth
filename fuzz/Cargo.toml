
[package]
name = "http-auth-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
env_logger = "0.9"
libfuzzer-sys = "0.4"
log = "0.4"
nom = "7.0"

[dependencies.http-auth]
path = ".."
features = ["trace", "server"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "parse_challenges"
path = "fuzz_targets/parse_challenges.rs"
test = false
doc = false

[[bin]]
name = "parse_credentials"
path = "fuzz_targets/parse_credentials.rs"
test = false
doc = false

[[bin]]
name = "render_challenges"
path = "fuzz_targets/render_challenges.rs"
test = false
doc = false

[[bin]]
name = "digest_response"
path = "fuzz_targets/digest_response.rs"
test = false
doc = false
