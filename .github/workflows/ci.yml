name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Test
    strategy:
      matrix:
        rust:
          - stable
          - '1.70'
        include:
          - rust: stable
            extra_components: rustfmt
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: ${{ matrix.extra_components }}
    - name: Test with all features
      env:
        HTTP_AUTH_REQUIRE_CURL: 1
      run: cargo test --all-features --all-targets
    - name: Compile with no features
      run: cargo check --no-default-features
    - name: Compile each feature combination
      env:
        RUSTFLAGS: -D warnings
      run: |
        for f in basic-scheme digest-scheme server server,basic-scheme server,digest-scheme server,basic-scheme,digest-scheme; do
          echo "features=[$f]"
          cargo check --tests --no-default-features --features "$f"
        done
    - name: Check fuzz tests compile (but don't actually fuzz)
      run: cd fuzz && cargo check && cargo test
    - name: Check main crate formatting
      if: matrix.rust == 'stable'
      run: cargo fmt -- --check
    - name: Check fuzz crate formatting
      if: matrix.rust == 'stable'
      run: cd fuzz && cargo fmt -- --check
  license:
    name: Check copyright/license headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - run: find . -name target -prune -o -type f -print0 | xargs -0 .github/workflows/check-license.py
